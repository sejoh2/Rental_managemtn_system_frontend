<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kodi</title>
    <meta name="description" content="Rental management for property owners in Kenya: M-Pesa payments matched automatically, water billing from meter readings, SMS rent reminders and deposit reconciliation." />
    <!-- How links to the site look when shared (WhatsApp, social media). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kodi — Rental management for property owners" />
    <meta property="og:description" content="M-Pesa payments matched automatically, water billing, SMS rent reminders and deposits — every unit, tenant and shilling accounted for." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Installable app: see public/manifest.webmanifest and public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F7F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110E" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kodi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Sets light or dark before the page is drawn, so it never flashes the wrong one. See src/utils/theme.js. -->
    <script>
      (function () {
        var mode = 'system'

        try {
          mode = localStorage.getItem('kodi-theme') || 'system'
        } catch (error) {}

        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }

        document.documentElement.dataset.theme = mode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
