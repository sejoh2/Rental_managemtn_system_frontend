<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rental-management-system_frontend</title>
    <!-- Sets light or dark before the page is drawn, so it never flashes the wrong one. See src/utils/theme.js. -->
    <script>
      (function () {
        var mode = 'system'

        try {
          mode = localStorage.getItem('kodi-theme') || 'system'
        } catch (error) {}

        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }

        document.documentElement.dataset.theme = mode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
